name: Bug / Баг
description: Something works differently than it should / Что-то работает не так, как должно
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more precise the steps, the faster it can be reproduced and fixed.
        You can drag a screenshot or a short video into any field. English or Russian, both are fine.

        Спасибо, что сообщаете! Чем точнее шаги, тем быстрее получится повторить и починить.
        Скриншот или короткое видео можно просто перетащить в любое поле. Можно по-русски.
  - type: textarea
    id: steps
    attributes:
      label: What you did / Что делали
      description: Step by step, what happened before the bug. / По шагам, что происходило перед ошибкой.
      placeholder: |
        1. Maximized the browser
        2. The cat was sleeping on a window frame
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected / Что ожидали
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened / Что вышло
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / Версия программы
      description: It is in the installer file name and in the Windows list of installed apps. / Есть в имени установщика и в списке установленных приложений Windows.
      placeholder: "1.0.2"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows
      options:
        - Windows 11
        - Windows 10
        - Other / Другая
    validations:
      required: true
  - type: dropdown
    id: monitors
    attributes:
      label: Monitors / Сколько мониторов
      options:
        - "1"
        - "2"
        - "3+"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else / Что ещё важно
      description: Optional. Display scaling, taskbar on the side, the game or app where it happened. / Необязательно. Масштаб экрана, панель задач сбоку, игра или программа, где это случилось.
    validations:
      required: false
