name: Feedback / Отзыв
description: What you liked, what gets in the way, what is missing / Что понравилось, что мешает, чего не хватает
title: "Feedback: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for writing! Fill in whatever you like and skip the rest. If something broke, the "Bug" template works better.

        Спасибо, что пишете! Заполните то, что хочется, остальное можно пропустить. Если что-то сломалось, лучше выбрать шаблон «Баг».
  - type: textarea
    id: liked
    attributes:
      label: What you liked / Что понравилось
      placeholder: For example, how she sleeps on a window frame
    validations:
      required: false
  - type: textarea
    id: annoying
    attributes:
      label: What gets in the way / Что мешает или бесит
      placeholder: What distracts you from work, what you would like to turn off
    validations:
      required: false
  - type: textarea
    id: idea
    attributes:
      label: Idea / Идея
      placeholder: What else should she learn
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App version / Версия программы
      description: Optional. It is in the installer file name and in the Windows list of installed apps. / Необязательно. Есть в имени установщика и в списке установленных приложений Windows.
      placeholder: "1.0.0"
    validations:
      required: false
